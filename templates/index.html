{% extends "base.html" %}

{% block content %}
<h2>Add an expense</h2>
<form method="post" action="{{ url_for('add_expense') }}">
  <label>Amount
    <input type="number" name="amount" step="0.01" min="0.01" required>
  </label>
  <label>Category
    <select name="category" required>
      {% for c in categories %}
        <option>{{ c }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Date
    <input type="date" name="spent_on" value="{{ today }}" required>
  </label>
  <label>Note
    <input type="text" name="note" maxlength="200" placeholder="optional">
  </label>
  <button type="submit">Add</button>
</form>

<p>You have saved <strong>{{ count }}</strong> expense{{ "" if count == 1 else "s" }}.</p>
{% endblock %}
